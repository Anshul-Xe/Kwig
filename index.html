<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kwig</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  
  <!-- Local Styles -->
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  
  <!-- Mockup frame container for premium display (goes full screen on mobile screens) -->
  <div id="app-container">
    
    <!-- Blurry Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Navigation Sidebar Drawer -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-avatar">K</div>
        <div class="sidebar-profile">
          <div class="profile-name">Kwig Cloud Account</div>
          <div class="profile-sync"><i class="ti ti-cloud-check"></i> Google Drive Synced</div>
        </div>
      </div>

      <div class="sidebar-menu">
        <div class="sidebar-section">Workspace</div>
        <a href="#" class="sidebar-item active" id="sb-home" onclick="event.preventDefault(); window.goTo('home'); window.closeSidebar();">
          <i class="ti ti-smart-home" aria-hidden="true"></i> Dashboard
        </a>
        <a href="#" class="sidebar-item" id="sb-db" onclick="event.preventDefault(); window.goTo('database'); window.closeSidebar();">
          <i class="ti ti-database" aria-hidden="true"></i> Database Logs
        </a>

        <div class="sidebar-section">
          <span>The Void</span>
          <button class="sb-add-btn" onclick="event.stopPropagation(); window.createNewPage();" title="Add new note">+</button>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding-right:6px; box-sizing:border-box;">
          <a href="#" class="sidebar-item" id="sb-void-mgr" style="flex:1;" onclick="event.preventDefault(); window.goTo('notes'); window.closeSidebar();">
            <i class="ti ti-folder-open" aria-hidden="true"></i> Note Pages
          </a>
          <button id="sb-void-toggle" onclick="event.preventDefault(); event.stopPropagation(); window.toggleSidebarPages();" style="background:none; border:none; color:var(--color-text-tertiary); padding:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; outline:none; margin-left:4px;" title="Toggle notes list">
            <i class="ti ti-chevron-down" id="sb-void-chevron" style="font-size:12px; transition:transform 0.2s;"></i>
          </button>
        </div>
        
        <!-- Sub-list of pages (rendered dynamically by JS) -->
        <div id="sidebar-pages-list" class="sidebar-pages-sublist"></div>

        <div class="sidebar-section">Account</div>
        <div id="sidebar-account-container"></div>
      </div>
    </aside>
    
    <!-- Permanent Mobile Native Header with Theme Toggle -->
    <header class="app-header">
      <div class="logo-text">
        <button id="menu-btn" aria-label="Open sidebar menu" style="background:none; border:none; color:inherit; cursor:pointer; padding:6px 8px; margin-left:-8px; display:inline-flex; align-items:center; justify-content:center; outline:none; -webkit-tap-highlight-color:transparent;" onclick="window.openSidebar()">
          <i class="ti ti-menu-2" aria-hidden="true" style="font-size: 18px; transition: transform 0.2s;"></i>
        </button>
        <span style="font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.05em; font-size: 15px; user-select:none; cursor:default;">Kwig</span>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="ti ti-moon" id="theme-icon" aria-hidden="true"></i>
      </button>
    </header>

    <h2 class="sr-only">Kwig - productivity, health and task tracker with weekly database</h2>
    
    <!-- Render mount point -->
    <div id="app"></div>

    <!-- Custom Modal Dialog (Kwig-style) -->
    <div id="delete-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title">Remove row?</div>
        <div class="modal-desc">Are you sure you want to delete this item? This action cannot be undone.</div>
        <div class="modal-buttons">
          <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
          <button id="modal-confirm-btn" class="modal-btn modal-btn-delete">Yes, Remove</button>
        </div>
      </div>
    </div>

    <!-- Floating Image Control Overlay -->
    <div id="image-control-bubble" class="image-control-bubble" style="display:none; position:absolute; z-index:1000; align-items:center; gap:4px;">
      <button class="bubble-btn" onclick="window.resizeSelectedImage('25%')">25%</button>
      <button class="bubble-btn" onclick="window.resizeSelectedImage('50%')">50%</button>
      <button class="bubble-btn" onclick="window.resizeSelectedImage('75%')">75%</button>
      <button class="bubble-btn" onclick="window.resizeSelectedImage('100%')">100%</button>
      <div class="bubble-divider"></div>
      <button class="bubble-btn icon-btn" onclick="window.alignSelectedImage('left')" title="Align Left"><i class="ti ti-align-left"></i></button>
      <button class="bubble-btn icon-btn" onclick="window.alignSelectedImage('center')" title="Align Center"><i class="ti ti-align-center"></i></button>
      <button class="bubble-btn icon-btn" onclick="window.alignSelectedImage('right')" title="Align Right"><i class="ti ti-align-right"></i></button>
      <div class="bubble-divider"></div>
      <button class="bubble-btn bubble-delete icon-btn" onclick="window.deleteSelectedImage()" title="Delete Image"><i class="ti ti-trash"></i></button>
    </div>

  </div>

  <!-- Hidden Image Import File Input Helper -->
  <input type="file" id="import-image-file" accept="image/*" style="display:none">

  <!-- App logic -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
